name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Platform-agnostic math: the geometry/scene core, fully tested.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test -p demoscene-core
      - run: cargo clippy -p demoscene-core -- -D warnings

  # Windows D3D12 backend — the runnable target.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p demoscene-app --release

  # macOS Metal backend — compile-checked here because there is no local Mac
  # to run it on. This is what keeps the Metal path from rotting.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p demoscene-app --release
